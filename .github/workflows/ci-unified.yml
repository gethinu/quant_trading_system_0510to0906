name: CI Unified

on:
  push:
    branches: [main, develop, branch0906]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches:
      [main, develop, branch0906, "claude/monitor-webapp", "claude/open-auto-run"]
  workflow_dispatch:
    inputs:
      reason:
        description: "Manual run while CI is paused"
        required: false
        type: string

concurrency:
  group: ci-unified-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci-scope:
    name: CI change scope
    runs-on: ubuntu-latest
    outputs:
      run_full: ${{ steps.scope.outputs.run_full }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve CI scope
        id: scope
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "run_full=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" > "$RUNNER_TEMP/changed-files.txt"

          run_full=false
          while IFS= read -r path; do
            case "$path" in
              docs/* | *.md | .github/ISSUE_TEMPLATE/*) ;;
              *) run_full=true; break ;;
            esac
          done < "$RUNNER_TEMP/changed-files.txt"

          echo "run_full=$run_full" >> "$GITHUB_OUTPUT"

  dashboard-build:
    needs: ci-scope
    if: needs.ci-scope.outputs.run_full == 'true'
    name: Dashboard build & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/dashboards/alpaca-next
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/dashboards/alpaca-next/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Static export (includes lint and TypeScript validation)
        run: npm run build

  powershell-contract:
    needs: ci-scope
    if: needs.ci-scope.outputs.run_full == 'true'
    name: Windows publish contract
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Parse scheduled PowerShell entrypoints
        shell: pwsh
        run: |
          $scripts = @(
            "scripts/publish_data_to_vercel.ps1",
            "scripts/open_auto_run.ps1"
          )
          foreach ($script in $scripts) {
            $contractTokens = $null
            $contractErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$contractTokens,
              [ref]$contractErrors
            ) | Out-Null
            if ($contractErrors.Count -gt 0) {
              Write-Error "PowerShell parse failed: $script"
              $contractErrors | ForEach-Object { Write-Error $_ }
              exit 1
            }
          }
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run publish source contracts
        run: |
          python -m pip install pytest pandas
          python -m pytest tests/system/test_publish_data_ps1_contract.py -o addopts='' -q

  lint-and-format:
    needs: ci-scope
    if: needs.ci-scope.outputs.run_full == 'true'
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install ruff black isort
      - name: Resolve lint scope
        id: lint-scope
        shell: bash
        run: |
          # main/develop/branch0906 は repo 全体を強制する (origin/main は現在
          # repo-wide clean。その保証を changed-files 縮退で手放さない)。
          # claude/* 等の運用 branch を base にする PR だけ、既存の lint 債務を
          # 抱えたままでも新規変更を検証できるよう changed-files へ縮退する。
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            target="${{ github.event.pull_request.base.ref }}"
          else
            target="${{ github.ref_name }}"
          fi
          case "$target" in
            main | develop | branch0906) full="true" ;;
            *) full="false" ;;
          esac
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "lint scope: target=$target full_repo=$full"
      - name: List lint targets
        id: lint-targets
        shell: bash
        run: |
          out="$RUNNER_TEMP/lint-targets.txt"
          if [[ "${{ steps.lint-scope.outputs.full }}" == "true" ]]; then
            printf '.\n' > "$out"
          else
            base="${{ github.event.before }}"
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              base="${{ github.event.pull_request.base.sha }}"
            fi
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              base="$(git rev-parse HEAD^)"
            fi
            git diff --name-only --diff-filter=ACMR "$base" "$GITHUB_SHA" -- '*.py' > "$out"
          fi
          echo "count=$(wc -l < "$out")" >> "$GITHUB_OUTPUT"
          cat "$out"
      - name: isort (import order check)
        if: steps.lint-targets.outputs.count != '0'
        shell: bash
        run: |
          mapfile -t targets < "$RUNNER_TEMP/lint-targets.txt"
          isort --check-only "${targets[@]}"
      - name: Ruff (lint)
        if: steps.lint-targets.outputs.count != '0'
        shell: bash
        run: |
          mapfile -t targets < "$RUNNER_TEMP/lint-targets.txt"
          ruff check "${targets[@]}" --output-format=github
      - name: Black (format check)
        if: steps.lint-targets.outputs.count != '0'
        shell: bash
        run: |
          mapfile -t targets < "$RUNNER_TEMP/lint-targets.txt"
          black --check "${targets[@]}"

  test-and-coverage:
    name: Test & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [ci-scope, lint-and-format]
    if: needs.ci-scope.outputs.run_full == 'true' && needs.lint-and-format.result == 'success'
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: 1
      PYTHONUNBUFFERED: 1
      COMPACT_TODAY_LOGS: "1"
      ENABLE_PROGRESS_EVENTS: "0"
      PYTEST_USE_FAKE_SYMBOLS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libatlas-base-dev libopenblas-dev
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest-cov coverage[toml]
      - name: Run tests with coverage
        run: |
          pytest -q \
            --cov=core \
            --cov=common \
            --cov=strategies \
            --cov-report=term-missing \
            --cov-report=html:htmlcov \
            --cov-report=xml:coverage.xml \
            --cov-report=json:coverage.json
      - name: Coverage summary (markdown)
        run: |
          echo "## 📊 Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          coverage report --skip-empty >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Check System7 threshold (warn-only)
        run: |
          python - <<'PY'
          import json
          import sys
          import pathlib

          p = pathlib.Path("coverage.json")
          if not p.exists():
              print("::notice::coverage.json not found")
              sys.exit(0)

          data = json.loads(p.read_text())
          files = data.get("files", {})

          # Find core/system7.py in the coverage json
          key = None
          for k in files.keys():
              if k.endswith("core/system7.py"):
                  key = k
                  break

          if not key:
              print("::notice::core/system7.py not found in coverage json")
              sys.exit(0)

          summary = files[key].get("summary", {})
          percent = summary.get("percent_covered")

          if percent is None:
              print("::notice::percent_covered not found")
              sys.exit(0)

          print(f"System7 coverage: {percent:.2f}%")
          if percent < 66.0:
              print(f"::warning::System7 coverage ({percent:.2f}%) is below 66%")
          else:
              print(f"System7 coverage OK ({percent:.2f}%)")
          PY
      - name: Upload coverage HTML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-html
          path: htmlcov/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload coverage XML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-xml
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 30
      - name: Upload coverage JSON
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-json
          path: coverage.json
          if-no-files-found: warn
          retention-days: 30

  ci-required:
    name: CI Required
    runs-on: ubuntu-latest
    if: always()
    needs:
      - ci-scope
      - dashboard-build
      - powershell-contract
      - lint-and-format
      - test-and-coverage
    steps:
      - name: Evaluate required CI
        shell: bash
        env:
          RUN_FULL: ${{ needs.ci-scope.outputs.run_full }}
          SCOPE_RESULT: ${{ needs.ci-scope.result }}
          DASHBOARD_RESULT: ${{ needs.dashboard-build.result }}
          POWERSHELL_RESULT: ${{ needs.powershell-contract.result }}
          LINT_RESULT: ${{ needs.lint-and-format.result }}
          TEST_RESULT: ${{ needs.test-and-coverage.result }}
        run: |
          if [[ "$SCOPE_RESULT" != "success" ]]; then
            echo "CI scope resolution failed: $SCOPE_RESULT"
            exit 1
          fi

          if [[ "$RUN_FULL" != "true" ]]; then
            echo "Docs-only change: full CI not required."
            exit 0
          fi

          failed=0
          for result in \
            "$DASHBOARD_RESULT" \
            "$POWERSHELL_RESULT" \
            "$LINT_RESULT" \
            "$TEST_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "Required CI job did not succeed: $result"
              failed=1
            fi
          done
          exit "$failed"
